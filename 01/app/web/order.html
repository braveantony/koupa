<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F7F1E8">
<title>Koupa 酷杯 - 點餐</title>
<link rel="stylesheet" href="/app.css">
</head>
<body data-page="order">
<header class="site">
  <div class="brand"><a class="brand-name" href="/">Koupa 酷杯</a><span class="slogan">一杯好茶，隨時都在</span></div>
  <nav aria-label="頁面"><a href="/" aria-current="page">點餐</a><a href="/kitchen">廚房</a><a href="/board">叫號看板</a></nav>
</header>
<main class="order">
  <section id="shop">
    <h1>今天想喝什麼？</h1>
    <ul id="menu" class="cards" aria-label="菜單"></ul>
  </section>
  <div class="cart" id="cart">
    <p id="notice" class="notice" aria-live="polite"></p>
    <div class="cart-bar">
      <div class="cart-sum"><span id="cups">0</span> 杯<span class="dot">・</span>NT$ <span id="total">0</span></div>
      <button id="submit" type="button" disabled>確認點餐</button>
    </div>
  </div>
  <section id="result" class="done" aria-live="polite" hidden>
    <span class="label">訂單成立，您的號碼牌</span>
    <span id="ticket" class="ticket num"></span>
    <p>做好會在店內的叫號螢幕叫號，<br>請留意螢幕上的號碼。</p>
    <div class="receipt">
      <ul id="lines"></ul>
      <div class="sum"><span>合計</span><span>NT$ <span id="paid"></span></span></div>
    </div>
    <button id="again" class="btn-secondary" type="button">再點一單</button>
  </section>
</main>
<footer id="debug" class="debug" hidden><span>?debug=1</span><span id="version"></span><span id="pod"></span></footer>
<script src="/app.js"></script>
</body>
</html>
