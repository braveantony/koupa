<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F7F1E8">
<title>Koupa 酷杯 - 廚房</title>
<link rel="stylesheet" href="/app.css">
</head>
<body data-page="kitchen">
<header class="site">
  <div class="brand"><a class="brand-name" href="/">Koupa 酷杯</a><span class="slogan">一杯好茶，隨時都在</span></div>
  <nav aria-label="頁面"><a href="/">點餐</a><a href="/kitchen" aria-current="page">廚房</a><a href="/board">叫號看板</a></nav>
</header>
<main class="kitchen">
  <div class="section-head">
    <h1>製作中</h1>
    <span class="pill"><span id="count">0</span> 張</span>
    <span class="hint">每 2 秒自動更新</span>
  </div>
  <p id="msg" class="notice err" role="status"></p>
  <ul id="orders" class="tickets" aria-label="製作中的訂單"></ul>
  <p id="no-orders" class="empty" hidden>目前沒有製作中的訂單</p>
  <section id="supply" class="supply" aria-labelledby="menu-title" hidden>
    <div class="section-head"><h2 id="menu-title">品項供應</h2></div>
    <p>賣完的品項按「設為售完」，點餐頁會立刻顯示「今日售完」。</p>
    <ul id="menu" class="supply-list"></ul>
  </section>
</main>
<footer id="debug" class="debug" hidden><span>?debug=1</span><span id="version"></span><span id="pod"></span></footer>
<script src="/app.js"></script>
</body>
</html>
