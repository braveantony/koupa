# Step 2: delay SIGTERM with a preStop sleep so endpoint removal can reach
# the gateway first. 7 s = ceil(candidate 1.504 s) + 5 s buffer: the
# candidate for this environment (tkha), from `measure.sh calibrate` on
# 2026-11-09 22:06 (evidence/calibrate-20261109-220635/), 3 runs; L is the
# Pod's last unambiguous per-attempt ingress selection by any request
# (upstream_attempts 1): 7 valid samples (6 when L used probes only),
# upper bounds are model estimates (A11 step 4; no direct endpoint-update
# evidence). The earlier calibration (18:14) re-evaluated the same way
# gives 1.445 s from 6 valid samples; across both, the last ingress
# selection of any request to a terminating Pod was at most 1.457 s after
# the delete request (18 Pods). The 5 s buffer is PROVISIONAL. Grace stays
# at the default 30 s.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../step-1
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: koupa
        namespace: koupa
      spec:
        template:
          spec:
            containers:
              - name: koupa
                lifecycle:
                  preStop:
                    sleep:
                      seconds: 7
