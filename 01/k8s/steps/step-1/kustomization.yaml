# Step 1: delay SIGTERM with a preStop sleep so endpoint removal can reach
# the gateway first. 7 s = ceil(candidate 1.445 s) + 5 s buffer: the
# candidate for this environment (tkha), from `measure.sh calibrate` on
# 2026-11-09, 6 valid samples over 3 runs, upper bounds are model estimates
# (A11 step 4; no direct endpoint-update evidence), evidence in
# evidence/calibrate-20261109-181427/candidate.json. The 5 s buffer is
# PROVISIONAL until calibrated more often. Grace stays at the default 30 s.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: koupa
        namespace: koupa
      spec:
        template:
          spec:
            containers:
              - name: koupa
                lifecycle:
                  preStop:
                    sleep:
                      seconds: 7
