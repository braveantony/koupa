# Idle-disconnect lab (design 4.3), heartbeat on: the app sends an SSE
# comment line every 15 s, well under the gateway's 300 s stream idle
# timeout. Measured on tkha (docs/measurements/2026-11-10.md): without the
# heartbeat an idle board is cut at 300 s (SI, stream_idle_timeout); with
# it the stream stays up; the route has no total timeout, so none is set.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: koupa
        namespace: koupa
      spec:
        template:
          spec:
            containers:
              - name: koupa
                env:
                  - name: SSE_HEARTBEAT
                    value: 15s
