# No retry and no timeouts on purpose: the gateway must not retry for us
# (upstream attempts stay at 1), and without timeouts Cilium sets no route
# timeout, so SSE streams are not cut (env-findings 3.1, 3.2).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: koupa
  namespace: koupa
spec:
  parentRefs:
    - name: koupa
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: koupa
          port: 80
