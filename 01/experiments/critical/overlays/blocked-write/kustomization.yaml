# Critical-timing experiments (plan A12) timing 5: every mechanism on (step
# 4 plus TEST_HOOKS), and in test mode a 64 KiB SSE comment line every
# 10 ms (TEST_SSE_FILLER_BYTES, SSE_HEARTBEAT) so a board that stops
# reading fills the socket buffers within moments. Never used for real
# measurements.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../k8s/test-hooks
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: koupa
        namespace: koupa
      spec:
        template:
          spec:
            containers:
              - name: koupa
                env:
                  - name: SSE_HEARTBEAT
                    value: 10ms
                  - name: TEST_SSE_FILLER_BYTES
                    value: "65536"
  # Experiment images: pulled each rollout through the pull secret that
  # lib.sh creates (none when the images are public; then pulled anonymously).
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: koupa
        namespace: koupa
      spec:
        template:
          spec:
            imagePullSecrets:
              - name: ghcr-experiments
            containers:
              - name: koupa
                imagePullPolicy: Always
