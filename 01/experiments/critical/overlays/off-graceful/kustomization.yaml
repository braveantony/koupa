# Critical-timing experiments (plan A12): timing 2 (and A10's state samples) with the step-2 mechanism off.
# Only this row's switch is off; everything else is step 4 plus TEST_HOOKS
# (k8s/test-hooks). Never used for real measurements.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../k8s/test-hooks
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: koupa
        namespace: koupa
      spec:
        template:
          spec:
            containers:
              - name: koupa
                env:
                  - name: GRACEFUL_SHUTDOWN
                    value: "0"
