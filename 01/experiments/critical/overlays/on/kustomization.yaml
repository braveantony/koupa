# Critical-timing experiments (plan A12), every mechanism on: step 5 plus
# TEST_HOOKS (k8s/test-hooks). Never used for real measurements.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../k8s/test-hooks
patches:
  # Experiment images: pulled each rollout through the pull secret that
  # lib.sh creates (none when the images are public; then pulled anonymously).
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: koupa
        namespace: koupa
      spec:
        template:
          spec:
            imagePullSecrets:
              - name: ghcr-experiments
            containers:
              - name: koupa
                imagePullPolicy: Always
